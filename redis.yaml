- name: Install Redis Component
  hosts: redis
  become: true
  tasks:
    - name: Install Remi release repository
      ansible.builtin.dnf:
        name: https://rpms.remirepo.net/enterprise/remi-release-8.rpm
        state: present
        disable_gpg_check: true

    - name: Enable Redis 6.2 Remi module
      ansible.builtin.dnf:
        name: '@redis:remi-6.2'
        state: present

    - name: Install Redis package
      ansible.builtin.dnf:
        name: redis
        state: present

    - name: Allow remote connections in Redis configuration
      ansible.builtin.replace:
        path: /etc/redis/redis.conf
        regexp: '^bind 127\.0\.0\.1'
        replace: 'bind 0.0.0.0'
      notify: Restart Redis

    - name: Ensure Redis service is running and enabled
      ansible.builtin.service:
        name: redis
        state: started
        enabled: true

  handlers:
    - name: Restart Redis
      ansible.builtin.service:
        name: redis
        state: restarted